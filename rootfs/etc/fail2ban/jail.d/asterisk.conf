# Fail2Ban jail for Asterisk
# This will be dynamically configured by the startup script

[asterisk]
enabled = true
filter = asterisk
action = iptables-allports[name=asterisk, protocol=all]
logpath = /var/log/asterisk/messages
maxretry = 3
bantime = 3600
findtime = 600
ignoreip = 127.0.0.1/8 ::1
# Asterisk logs with dateformat=%F %T -> "[2025-01-01 12:00:00]"
datepattern = ^\[%%Y-%%m-%%d %%H:%%M:%%S\]
