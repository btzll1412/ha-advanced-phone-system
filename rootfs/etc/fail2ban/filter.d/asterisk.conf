# Fail2Ban filter for Asterisk SIP attacks
# Catches registration failures, authentication failures, and call fraud attempts

[INCLUDES]
before = common.conf

[Definition]
_daemon = asterisk

# Match various Asterisk security log patterns
failregex = ^.*NOTICE.*: Registration from '.*' failed for '<HOST>(:\d+)?' - (?:Wrong password|Username/auth name mismatch|No matching peer found|Not a local domain|Device does not match ACL|Peer is not supposed to register|ACL error|No users).*$
            ^.*NOTICE.*: <HOST> failed to authenticate as '.*'.*$
            ^.*NOTICE.*: No registration for peer '.*' \(from <HOST>\).*$
            ^.*NOTICE.* <HOST> failed to authenticate as '.*'.*$
            ^.*NOTICE.*: Sending fake auth rejection for device .*\(<HOST>\).*$
            ^.*NOTICE.*: Registration from '.*<sip:.*@<HOST>(:\d+)?>' failed.*$
            ^.*NOTICE.*: Call from '.*' \(<HOST>:\d+\) to extension '.*' rejected because extension not found.*$
            ^.*NOTICE.*acl\.c.*: SIP Peer ACL: Rejecting '<HOST>' due to a failure to pass ACL.*$
            ^.*SECURITY.*: SecurityEvent="FailedACL".*RemoteAddress="IPV[46]/[^/]*/(<HOST>)/.*".*$
            ^.*SECURITY.*: SecurityEvent="InvalidAccountID".*RemoteAddress="IPV[46]/[^/]*/(<HOST>)/.*".*$
            ^.*SECURITY.*: SecurityEvent="ChallengeResponseFailed".*RemoteAddress="IPV[46]/[^/]*/(<HOST>)/.*".*$
            ^.*SECURITY.*: SecurityEvent="InvalidPassword".*RemoteAddress="IPV[46]/[^/]*/(<HOST>)/.*".*$

ignoreregex =

# Use this when checking against the full Asterisk log
journalmatch = _COMM=asterisk
