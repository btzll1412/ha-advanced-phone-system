# Fail2Ban filter for Asterisk SIP attacks
# Catches registration failures, authentication failures, and call fraud attempts

[INCLUDES]
before = common.conf

[Definition]
_daemon = asterisk

# Match various Asterisk security log patterns
failregex = ^%(__prefix_line)sNOTICE.* .*: Registration from '.*' failed for '<HOST>(:\d+)?' - (?:Wrong password|Username/auth name mismatch|No matching peer found|Not a local domain|Device does not match ACL|Peer is not supposed to register|ACL error|No users)$
            ^%(__prefix_line)sNOTICE.* .*: <HOST> failed to authenticate as '.*'$
            ^%(__prefix_line)sNOTICE.* .*: No registration for peer '.*' \(from <HOST>\)$
            ^%(__prefix_line)sNOTICE.* <HOST> failed to authenticate as '.*'$
            ^%(__prefix_line)sNOTICE.* .*: Sending fake auth rejection for device .*\(<HOST>\)$
            ^%(__prefix_line)sNOTICE.* .*: Registration from '.*<sip:.*@<HOST>(:\d+)?>' failed.*$
            ^%(__prefix_line)sNOTICE.* .*: Failed to authenticate device .*<sip:.*@<HOST>(:\d+)?>;tag=.* for INVITE.*$
            ^%(__prefix_line)sNOTICE.* .*: Call from '.*' \(<HOST>:\d+\) to extension '.*' rejected because extension not found.*$
            ^%(__prefix_line)sWARNING.* .*: Ext\. s: "]]>]> from <HOST>.*$
            ^%(__prefix_line)sSECURITY.* .*: SecurityEvent="FailedACL".*RemoteAddress="IPV[46]/[^/]*/(<HOST>)/.*".*$
            ^%(__prefix_line)sSECURITY.* .*: SecurityEvent="InvalidAccountID".*RemoteAddress="IPV[46]/[^/]*/(<HOST>)/.*".*$
            ^%(__prefix_line)sSECURITY.* .*: SecurityEvent="ChallengeResponseFailed".*RemoteAddress="IPV[46]/[^/]*/(<HOST>)/.*".*$
            ^%(__prefix_line)sSECURITY.* .*: SecurityEvent="InvalidPassword".*RemoteAddress="IPV[46]/[^/]*/(<HOST>)/.*".*$

ignoreregex =

# Use this when checking against the full Asterisk log
journalmatch = _COMM=asterisk
