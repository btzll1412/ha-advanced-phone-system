[general]
; Answering Machine Detection Configuration
; These settings are tuned for typical US voicemail systems

; Initial silence - how long to wait for audio before deciding (ms)
initial_silence = 2500

; Greeting - maximum length of a greeting before deciding it's a machine (ms)
greeting = 1500

; After greeting silence - silence after greeting that indicates machine (ms)
after_greeting_silence = 800

; Total analysis time before giving up (ms)
total_analysis_time = 5000

; Minimum word length to be considered a word (ms)
min_word_length = 100

; Time between words that indicates end of greeting (ms)
between_words_silence = 50

; Maximum number of words before deciding machine
maximum_number_of_words = 3

; Silence threshold (dB) - lower = more sensitive to silence
silence_threshold = 256

; Maximum wait time for human to say something after initial silence
maximum_word_length = 5000
