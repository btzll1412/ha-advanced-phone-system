[general]
static=yes
writeprotect=no

; =====================================
; INTERNAL CALLS (Extension to Extension)
; =====================================
[internal]
exten => _XXX,1,NoOp(📞 Internal Call: ${CALLERID(num)} → ${EXTEN})
    same => n,Set(CHANNEL(language)=en)
    same => n,Set(CALL_DIRECTION=internal)
    same => n,Dial(PJSIP/${EXTEN},30,rtT)
    same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy:unavail)
    same => n(unavail),Playback(vm-nobodyavail)
    same => n,Hangup()
    same => n(busy),Playback(vm-userbusy)
    same => n,Hangup()

exten => _XXXX,1,NoOp(📞 Internal Call: ${CALLERID(num)} → ${EXTEN})
    same => n,Set(CHANNEL(language)=en)
    same => n,Set(CALL_DIRECTION=internal)
    same => n,Dial(PJSIP/${EXTEN},30,rtT)
    same => n,Hangup()

; =====================================
; OUTBOUND CALLS (To External Numbers)
; =====================================
[outbound]
; 10-digit US number
exten => _NXXNXXXXXX,1,NoOp(📤 Outbound: ${CALLERID(num)} → ${EXTEN})
    same => n,Set(CHANNEL(language)=en)
    same => n,Set(CALL_DIRECTION=outbound)
    same => n,Set(CALLERID(all)=${CALLER_NUMBER})
    same => n,Dial(PJSIP/${EXTEN}@trunk_main,60,rtT)
    same => n,Hangup()

; 11-digit with leading 1
exten => _1NXXNXXXXXX,1,NoOp(📤 Outbound: ${CALLERID(num)} → ${EXTEN})
    same => n,Set(CHANNEL(language)=en)
    same => n,Set(CALL_DIRECTION=outbound)
    same => n,Set(CALLERID(all)=${CALLER_NUMBER})
    same => n,Dial(PJSIP/${EXTEN:1}@trunk_main,60,rtT)
    same => n,Hangup()

; International or + prefix
exten => _+.,1,NoOp(📤 Outbound International: ${EXTEN})
    same => n,Set(CHANNEL(language)=en)
    same => n,Set(CALL_DIRECTION=outbound)
    same => n,Set(CALLERID(all)=${CALLER_NUMBER})
    same => n,Dial(PJSIP/${EXTEN:1}@trunk_main,60,rtT)
    same => n,Hangup()

; Emergency
exten => 911,1,NoOp(🚨 Emergency Call)
    same => n,Set(CALL_DIRECTION=outbound)
    same => n,Dial(PJSIP/911@trunk_main,60)
    same => n,Hangup()

; =====================================
; INBOUND CALLS (From External)
; =====================================
[from-external]
exten => _X.,1,NoOp(📥 Inbound: ${CALLERID(num)} → DID ${EXTEN})
    same => n,Set(CHANNEL(language)=en)
    same => n,Set(CALL_DIRECTION=inbound)
    same => n,Set(INBOUND_DID=${EXTEN})
    same => n,Answer()
    same => n,Wait(1)
    ; Route to extension 100 by default
    same => n,Dial(PJSIP/100,30,rtT)
    same => n,Playback(vm-nobodyavail)
    same => n,Hangup()

exten => s,1,NoOp(📥 Inbound - No DID match)
    same => n,Set(CALL_DIRECTION=inbound)
    same => n,Answer()
    same => n,Playback(hello-world)
    same => n,Hangup()

; =====================================
; OUTBOUND PLAYBACK (Broadcasts/TTS)
; =====================================
[outbound-playback]
exten => s,1,NoOp(📻 Broadcast Call ID: ${CALL_ID})
    same => n,Set(CHANNEL(language)=en)
    same => n,Set(CALL_DIRECTION=${CALL_DIRECTION})
    same => n,Answer()
    same => n,Wait(${PRE_MESSAGE_DELAY})
    same => n,Playback(${AUDIO_FILE})
    same => n,Wait(1)
    same => n,Hangup()

; =====================================
; DEFAULT CONTEXT
; =====================================
[default]
; Internal extensions
exten => _XXX,1,Goto(internal,${EXTEN},1)
exten => _XXXX,1,Goto(internal,${EXTEN},1)

; External numbers
exten => _NXXNXXXXXX,1,Goto(outbound,${EXTEN},1)
exten => _1NXXNXXXXXX,1,Goto(outbound,${EXTEN},1)
exten => _+.,1,Goto(outbound,${EXTEN},1)

; Emergency
exten => 911,1,Goto(outbound,911,1)
