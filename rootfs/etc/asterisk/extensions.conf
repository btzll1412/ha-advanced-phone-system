[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

[default]
; Allow extensions to call each other
exten => _XXX,1,Dial(SIP/${EXTEN},30)
exten => _XXX,n,Hangup()

; Allow outbound calls through trunk
exten => _NXXXXXXXXX,1,Dial(SIP/trunk_main/${EXTEN},60)
exten => _NXXXXXXXXX,n,Hangup()

exten => _1NXXXXXXXXX,1,Dial(SIP/trunk_main/${EXTEN},60)
exten => _1NXXXXXXXXX,n,Hangup()

; Recording extension
exten => 999,1,Answer()
exten => 999,n,Wait(1)
exten => 999,n,Playback(beep)
exten => 999,n,Record(/var/lib/asterisk/sounds/custom/recording-%d.wav)
exten => 999,n,Wait(1)
exten => 999,n,Playback(beep)
exten => 999,n,Hangup()

[outbound-playback]
exten => s,1,Answer()
exten => s,n,Wait(${PRE_MESSAGE_DELAY})
exten => s,n,Playback(${AUDIO_FILE})
exten => s,n,Wait(1)
exten => s,n,Hangup()

[inbound]
; Route incoming calls to extension 100
exten => _X.,1,Answer()
exten => _X.,n,Dial(SIP/100,30)
exten => _X.,n,Hangup()

[internal]
; Internal extension to extension calls
exten => _XXX,1,Dial(SIP/${EXTEN},30)
exten => _XXX,n,Hangup()
