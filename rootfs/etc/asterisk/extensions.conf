[general]
static=yes
writeprotect=no

; =====================================
; INTERNAL CALLS (Extension to Extension)
; =====================================
[internal]
exten => _XXX,1,NoOp(Internal Call from ${CALLERID(num)} to ${EXTEN})
    same => n,Set(CHANNEL(language)=en)
    same => n,Set(CALL_DIRECTION=internal)
    same => n,Dial(PJSIP/${EXTEN},30,rtT)
    same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy:unavail)
    same => n(unavail),VoiceMail(${EXTEN}@default,u)
    same => n,Hangup()
    same => n(busy),VoiceMail(${EXTEN}@default,b)
    same => n,Hangup()

exten => _XXXX,1,NoOp(Internal Call from ${CALLERID(num)} to ${EXTEN})
    same => n,Set(CHANNEL(language)=en)
    same => n,Set(CALL_DIRECTION=internal)
    same => n,Dial(PJSIP/${EXTEN},30,rtT)
    same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy:unavail)
    same => n(unavail),VoiceMail(${EXTEN}@default,u)
    same => n,Hangup()
    same => n(busy),VoiceMail(${EXTEN}@default,b)
    same => n,Hangup()

; =====================================
; OUTBOUND CALLS (To External Numbers)
; =====================================
[outbound]
exten => _NXXNXXXXXX,1,NoOp(Outbound Call to ${EXTEN})
    same => n,Set(CHANNEL(language)=en)
    same => n,Set(CALL_DIRECTION=outbound)
    same => n,Set(CALLERID(all)=${CALLER_NUMBER})
    same => n,Dial(PJSIP/${EXTEN}@trunk_main,60,rtT)
    same => n,Hangup()

exten => _1NXXNXXXXXX,1,NoOp(Outbound Call to ${EXTEN})
    same => n,Set(CHANNEL(language)=en)
    same => n,Set(CALL_DIRECTION=outbound)
    same => n,Set(CALLERID(all)=${CALLER_NUMBER})
    same => n,Dial(PJSIP/${EXTEN}@trunk_main,60,rtT)
    same => n,Hangup()

exten => _+1NXXNXXXXXX,1,NoOp(Outbound Call to ${EXTEN})
    same => n,Set(CHANNEL(language)=en)
    same => n,Set(CALL_DIRECTION=outbound)
    same => n,Set(CALLERID(all)=${CALLER_NUMBER})
    same => n,Dial(PJSIP/${EXTEN:2}@trunk_main,60,rtT)
    same => n,Hangup()

; Emergency
exten => 911,1,NoOp(Emergency Call)
    same => n,Set(CALL_DIRECTION=outbound)
    same => n,Dial(PJSIP/911@trunk_main)
    same => n,Hangup()

; =====================================
; INBOUND CALLS (From External)
; =====================================
[from-external]
exten => _X.,1,NoOp(Inbound call from ${CALLERID(num)} to DID: ${EXTEN})
    same => n,Set(CHANNEL(language)=en)
    same => n,Set(CALL_DIRECTION=inbound)
    same => n,Set(INBOUND_DID=${EXTEN})
    
    ; Answer the call
    same => n,Answer()
    same => n,Wait(1)
    
    ; Route based on DID configuration
    ; For now, route to extension 100
    same => n,Dial(PJSIP/100,30,rtT)
    same => n,VoiceMail(100@default,u)
    same => n,Hangup()

; Default incoming
exten => s,1,NoOp(Inbound call - no DID match)
    same => n,Set(CALL_DIRECTION=inbound)
    same => n,Answer()
    same => n,Playback(hello-world)
    same => n,Hangup()

; =====================================
; OUTBOUND PLAYBACK (Broadcasts/TTS)
; =====================================
[outbound-playback]
exten => s,1,NoOp(Outbound Playback - Call ID: ${CALL_ID})
    same => n,Set(CHANNEL(language)=en)
    same => n,Set(CALL_DIRECTION=${CALL_DIRECTION})
    same => n,Answer()
    same => n,Wait(${PRE_MESSAGE_DELAY})
    same => n,Playback(${AUDIO_FILE})
    same => n,Wait(1)
    same => n,Hangup()

; =====================================
; DEFAULT EXTENSION CONTEXT
; =====================================
[default]
; Extensions dial internal by default
exten => _XXX,1,Goto(internal,${EXTEN},1)
exten => _XXXX,1,Goto(internal,${EXTEN},1)

; External numbers go to outbound
exten => _NXXNXXXXXX,1,Goto(outbound,${EXTEN},1)
exten => _1NXXNXXXXXX,1,Goto(outbound,${EXTEN},1)

; Emergency
exten => 911,1,Goto(outbound,911,1)

; Voicemail access
exten => *97,1,VoiceMailMain(${CALLERID(num)}@default)
    same => n,Hangup()
