[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
RECORDING_DIR=/var/lib/asterisk/sounds/custom
IVR_PROMPTS=/var/lib/asterisk/sounds/ivr
; Admin PIN is now stored in database (configurable via web UI Settings)

[default]
; Allow extensions to call each other
exten => _XXX,1,Dial(SIP/${EXTEN},30)
exten => _XXX,n,Hangup()

; Allow outbound calls through trunk
exten => _NXXXXXXXXX,1,Dial(SIP/trunk_main/${EXTEN},60)
exten => _NXXXXXXXXX,n,Hangup()

exten => _1NXXXXXXXXX,1,Dial(SIP/trunk_main/${EXTEN},60)
exten => _1NXXXXXXXXX,n,Hangup()

; ============================================
; EXTENSION 999 - ADVANCED IVR SYSTEM
; ============================================
exten => 999,1,Answer()
exten => 999,n,Wait(1)
; Require PIN authentication first
exten => 999,n,Goto(ivr-pin-auth,s,1)

; ============================================
; IVR PIN AUTHENTICATION
; ============================================
[ivr-pin-auth]
exten => s,1,NoOp(IVR PIN Authentication)
; Fetch admin PIN from database via AGI
exten => s,n,AGI(verify_admin_pin.py)
exten => s,n,Set(PIN_ATTEMPTS=0)
exten => s,n(ask_pin),Playback(${IVR_PROMPTS}/enter-admin-pin)
exten => s,n,Read(ENTERED_PIN,,4,,,10)
exten => s,n,GotoIf($["${ENTERED_PIN}" = "${ADMIN_PIN}"]?pin_correct:pin_wrong)

; PIN correct - set up session and go to main menu
exten => s,n(pin_correct),Playback(${IVR_PROMPTS}/access-granted)
exten => s,n,Set(IVR_SESSION_ID=${STRFTIME(${EPOCH},,%Y%m%d%H%M%S)})
exten => s,n,Set(IVR_RECORDING=${RECORDING_DIR}/ivr-${IVR_SESSION_ID}.wav)
exten => s,n,Goto(ivr-main-menu,s,1)

; PIN wrong - allow retries
exten => s,n(pin_wrong),Set(PIN_ATTEMPTS=$[${PIN_ATTEMPTS} + 1])
exten => s,n,GotoIf($[${PIN_ATTEMPTS} >= 3]?too_many_attempts)
exten => s,n,Playback(${IVR_PROMPTS}/incorrect-pin)
exten => s,n,Goto(s,ask_pin)

; Too many failed attempts
exten => s,n(too_many_attempts),Playback(${IVR_PROMPTS}/too-many-attempts)
exten => s,n,Playback(${IVR_PROMPTS}/goodbye)
exten => s,n,Hangup()

; ============================================
; IVR MAIN MENU
; ============================================
[ivr-main-menu]
exten => s,1,NoOp(IVR Main Menu)
exten => s,n(menu),Background(${IVR_PROMPTS}/main-menu)
exten => s,n,WaitExten(10)
exten => s,n,Goto(s,menu)

; Press 1 - Record a message
exten => 1,1,NoOp(Record Message)
exten => 1,n,Playback(${IVR_PROMPTS}/record-after-beep)
exten => 1,n,Playback(beep)
exten => 1,n,Record(${IVR_RECORDING},,60,kq)
; After recording, go to review menu
exten => 1,n,Goto(ivr-review-recording,s,1)

; Press 2 - Listen to last recording
exten => 2,1,NoOp(Playback Last Recording)
exten => 2,n,GotoIf($[${STAT(e,${IVR_RECORDING})}]?play:nofile)
exten => 2,n(play),Playback(${IVR_PROMPTS}/playing-recording)
exten => 2,n,Playback(${IVR_RECORDING:0:-4})
exten => 2,n,Goto(ivr-main-menu,s,1)
exten => 2,n(nofile),Playback(${IVR_PROMPTS}/no-recording)
exten => 2,n,Goto(ivr-main-menu,s,1)

; Press 3 - Make outbound call (was 4, now 3 since re-record removed)
exten => 3,1,NoOp(Outbound Call Menu)
exten => 3,n,Goto(ivr-outbound-menu,s,1)

; Press 4 - Add contact to group
exten => 4,1,NoOp(Add Contact to Group)
exten => 4,n,Goto(ivr-add-contact,s,1)

; Press 9 - Repeat menu
exten => 9,1,Goto(ivr-main-menu,s,1)

; Press 0 - Exit
exten => 0,1,Playback(${IVR_PROMPTS}/goodbye)
exten => 0,n,Hangup()

; Timeout or invalid
exten => t,1,Goto(ivr-main-menu,s,1)
exten => i,1,Playback(${IVR_PROMPTS}/invalid-option)
exten => i,n,Goto(ivr-main-menu,s,1)

; ============================================
; IVR REVIEW RECORDING (after recording)
; ============================================
[ivr-review-recording]
exten => s,1,NoOp(Review Recording)
exten => s,n(menu),Background(${IVR_PROMPTS}/recording-options)
exten => s,n,WaitExten(10)
exten => s,n,Goto(s,menu)

; Press 1 - Listen to recording
exten => 1,1,Playback(${IVR_PROMPTS}/playing-recording)
exten => 1,n,Playback(${IVR_RECORDING:0:-4})
exten => 1,n,Goto(ivr-review-recording,s,1)

; Press 2 - Re-record
exten => 2,1,NoOp(Re-record)
exten => 2,n,System(rm -f ${IVR_RECORDING})
exten => 2,n,Playback(${IVR_PROMPTS}/record-after-beep)
exten => 2,n,Playback(beep)
exten => 2,n,Record(${IVR_RECORDING},,60,kq)
exten => 2,n,Goto(ivr-review-recording,s,1)

; Press 3 - Save and go to main menu
exten => 3,1,Playback(${IVR_PROMPTS}/recording-saved)
exten => 3,n,Goto(ivr-main-menu,s,1)

; Press 9 - Back to main menu (discard)
exten => 9,1,System(rm -f ${IVR_RECORDING})
exten => 9,n,Goto(ivr-main-menu,s,1)

; Timeout or invalid
exten => t,1,Goto(ivr-review-recording,s,1)
exten => i,1,Playback(${IVR_PROMPTS}/invalid-option)
exten => i,n,Goto(ivr-review-recording,s,1)

; ============================================
; IVR OUTBOUND CALL MENU
; ============================================
[ivr-outbound-menu]
exten => s,1,NoOp(Outbound Call Menu)
exten => s,n(menu),Background(${IVR_PROMPTS}/outbound-menu)
exten => s,n,WaitExten(10)
exten => s,n,Goto(s,menu)

; Press 1 - Broadcast to group
exten => 1,1,NoOp(Broadcast to Group)
exten => 1,n,AGI(ivr_handler.py,get_groups)
exten => 1,n,GotoIf($[${GROUP_COUNT} > 0]?hasgroups:nogroups)
exten => 1,n(nogroups),Playback(${IVR_PROMPTS}/no-groups)
exten => 1,n,Goto(ivr-outbound-menu,s,1)
exten => 1,n(hasgroups),Set(IVR_CALL_TYPE=broadcast)
exten => 1,n,Goto(ivr-select-group,s,1)

; Press 2 - Individual number
exten => 2,1,NoOp(Individual Number)
exten => 2,n,Set(IVR_CALL_TYPE=individual)
exten => 2,n,Goto(ivr-enter-number,s,1)

; Press 9 - Back to main menu
exten => 9,1,Goto(ivr-main-menu,s,1)

; Timeout or invalid
exten => t,1,Goto(ivr-outbound-menu,s,1)
exten => i,1,Playback(${IVR_PROMPTS}/invalid-option)
exten => i,n,Goto(ivr-outbound-menu,s,1)

; ============================================
; IVR SELECT GROUP
; ============================================
[ivr-select-group]
exten => s,1,NoOp(Select Group - ${GROUP_COUNT} groups available)
exten => s,n,Playback(${IVR_PROMPTS}/select-group)
; Announce available groups
exten => s,n,Set(i=1)
exten => s,n(loop),GotoIf($[${i} > ${GROUP_COUNT}]?waitsel)
exten => s,n,SayNumber(${i})
exten => s,n,Playback(${IVR_PROMPTS}/for)
; Play TTS audio for group name (generated by AGI), fallback to SayAlpha if not available
exten => s,n,GotoIf($["${GROUP_${i}_AUDIO}" != ""]?playtts:sayalpha)
exten => s,n(playtts),Playback(${GROUP_${i}_AUDIO})
exten => s,n,Goto(s,nextgroup)
exten => s,n(sayalpha),SayAlpha(${GROUP_${i}_NAME})
exten => s,n(nextgroup),Set(i=$[${i} + 1])
exten => s,n,Goto(s,loop)
exten => s,n(waitsel),Background(${IVR_PROMPTS}/press-number)
exten => s,n,WaitExten(10)
exten => s,n,Goto(s,1)

; Handle group selection (1-9)
exten => _X,1,NoOp(Selected group ${EXTEN})
exten => _X,n,AGI(ivr_handler.py,get_group,${EXTEN})
exten => _X,n,GotoIf($[${GROUP_FOUND} = 1]?found:notfound)
exten => _X,n(notfound),Playback(${IVR_PROMPTS}/invalid-group)
exten => _X,n,Goto(ivr-select-group,s,1)
exten => _X,n(found),Set(IVR_PHONE_NUMBERS=${SELECTED_GROUP_PHONES})
exten => _X,n,Set(IVR_GROUP_NAME=${SELECTED_GROUP_NAME})
; Use group's caller ID if set, otherwise leave IVR_CALLER_ID empty (API will use default)
exten => _X,n,Set(IVR_CALLER_ID=${SELECTED_GROUP_CID})
exten => _X,n,Playback(${IVR_PROMPTS}/group-selected)
exten => _X,n,Goto(ivr-record-greeting,s,1)

; Press 9 - Back
exten => 9,1,Goto(ivr-outbound-menu,s,1)

; Timeout or invalid
exten => t,1,Goto(ivr-select-group,s,1)
exten => i,1,Playback(${IVR_PROMPTS}/invalid-option)
exten => i,n,Goto(ivr-select-group,s,1)

; ============================================
; IVR ENTER PHONE NUMBER
; ============================================
[ivr-enter-number]
exten => s,1,NoOp(Enter Phone Number)
exten => s,n,Playback(${IVR_PROMPTS}/enter-phone-number)
exten => s,n,Read(IVR_PHONE_NUMBERS,,15,,,30)
exten => s,n,GotoIf($[${LEN(${IVR_PHONE_NUMBERS})} >= 10]?valid:invalid)
exten => s,n(invalid),Playback(${IVR_PROMPTS}/invalid-number)
exten => s,n,Goto(ivr-enter-number,s,1)
exten => s,n(valid),Playback(${IVR_PROMPTS}/you-entered)
exten => s,n,SayDigits(${IVR_PHONE_NUMBERS})
exten => s,n,Background(${IVR_PROMPTS}/press-1-confirm-2-reenter)
exten => s,n,WaitExten(10)
exten => s,n,Goto(s,1)

; Press 1 - Confirm number
exten => 1,1,Goto(ivr-record-greeting,s,1)

; Press 2 - Re-enter number
exten => 2,1,Goto(ivr-enter-number,s,1)

; Press 9 - Back
exten => 9,1,Goto(ivr-outbound-menu,s,1)

; Timeout or invalid
exten => t,1,Goto(ivr-enter-number,s,1)
exten => i,1,Playback(${IVR_PROMPTS}/invalid-option)
exten => i,n,Goto(ivr-enter-number,s,1)

; ============================================
; IVR RECORD GREETING
; ============================================
[ivr-record-greeting]
exten => s,1,NoOp(Record Greeting)
exten => s,n,Set(IVR_OUTBOUND_RECORDING=${RECORDING_DIR}/outbound-${IVR_SESSION_ID}.wav)
exten => s,n,Playback(${IVR_PROMPTS}/record-greeting-pound)
exten => s,n,Playback(beep)
exten => s,n,Record(${IVR_OUTBOUND_RECORDING},,120,kq)
exten => s,n,Playback(beep)
exten => s,n,Set(IVR_RECORDING_FILE=outbound-${IVR_SESSION_ID}.wav)
exten => s,n,Goto(ivr-recording-options,s,1)

; ============================================
; IVR RECORDING OPTIONS (for outbound/broadcast)
; ============================================
[ivr-recording-options]
exten => s,1,NoOp(Recording Options)
exten => s,n(menu),Background(${IVR_PROMPTS}/outbound-recording-options)
exten => s,n,WaitExten(10)
exten => s,n,Goto(s,menu)

; Press 1 - Listen to recording
exten => 1,1,Playback(${IVR_PROMPTS}/playing-recording)
exten => 1,n,Playback(${IVR_OUTBOUND_RECORDING:0:-4})
exten => 1,n,Goto(ivr-recording-options,s,1)

; Press 2 - Re-record
exten => 2,1,System(rm -f ${IVR_OUTBOUND_RECORDING})
exten => 2,n,Goto(ivr-record-greeting,s,1)

; Press 3 - Send out now
exten => 3,1,NoOp(Send Out Now)
exten => 3,n,Goto(ivr-send-now,s,1)

; Press 4 - Schedule for later
exten => 4,1,NoOp(Schedule for Later)
exten => 4,n,Goto(ivr-schedule,s,1)

; Press 9 - Back (discard recording)
exten => 9,1,System(rm -f ${IVR_OUTBOUND_RECORDING})
exten => 9,n,Goto(ivr-outbound-menu,s,1)

; Timeout or invalid
exten => t,1,Goto(ivr-recording-options,s,1)
exten => i,1,Playback(${IVR_PROMPTS}/invalid-option)
exten => i,n,Goto(ivr-recording-options,s,1)

; ============================================
; IVR SEND NOW
; ============================================
[ivr-send-now]
exten => s,1,NoOp(Sending call now)
exten => s,n,Set(IVR_RECORDING_FILE=${IVR_OUTBOUND_RECORDING})
exten => s,n,AGI(ivr_handler.py,initiate_call)
exten => s,n,GotoIf($[${CALL_INITIATED} = 1]?success:fail)
exten => s,n(success),Playback(${IVR_PROMPTS}/message-sent)
exten => s,n,Playback(${IVR_PROMPTS}/goodbye)
exten => s,n,Hangup()
exten => s,n(fail),Playback(${IVR_PROMPTS}/error-sending)
exten => s,n,Goto(ivr-recording-options,s,1)

; ============================================
; IVR SCHEDULE CALL
; ============================================
[ivr-schedule]
exten => s,1,NoOp(Schedule Call)
exten => s,n,Playback(${IVR_PROMPTS}/enter-date)
; Enter date as MMDDYYYY
exten => s,n,Read(IVR_DATE,,8,,,30)
exten => s,n,GotoIf($[${LEN(${IVR_DATE})} = 8]?validdate:invaliddate)
exten => s,n(invaliddate),Playback(${IVR_PROMPTS}/invalid-date)
exten => s,n,Goto(ivr-schedule,s,1)
exten => s,n(validdate),Playback(${IVR_PROMPTS}/enter-time)
; Enter time as HHMM (24hr)
exten => s,n,Read(IVR_TIME,,4,,,30)
exten => s,n,GotoIf($[${LEN(${IVR_TIME})} = 4]?validtime:invalidtime)
exten => s,n(invalidtime),Playback(${IVR_PROMPTS}/invalid-time)
exten => s,n,Goto(ivr-schedule,s,1)
exten => s,n(validtime),Set(IVR_DTMF_DATETIME=${IVR_DATE}${IVR_TIME})
exten => s,n,AGI(ivr_handler.py,format_schedule_time)
exten => s,n,GotoIf($[${DATETIME_VALID} = 1]?confirm:invaliddatetime)
exten => s,n(invaliddatetime),Playback(${IVR_PROMPTS}/invalid-datetime)
exten => s,n,Goto(ivr-schedule,s,1)
exten => s,n(confirm),Playback(${IVR_PROMPTS}/scheduled-for)
; Say the date and time
exten => s,n,SayUnixTime(${STRFTIME(${EPOCH},,%s)},,ABdY IM p)
exten => s,n,Goto(ivr-confirm-schedule,s,1)

; ============================================
; IVR CONFIRM SCHEDULE
; ============================================
[ivr-confirm-schedule]
exten => s,1,NoOp(Confirm Schedule)
exten => s,n(menu),Background(${IVR_PROMPTS}/confirm-schedule)
exten => s,n,WaitExten(10)
exten => s,n,Goto(s,menu)

; Press 1 - Confirm schedule
exten => 1,1,NoOp(Confirming schedule)
exten => 1,n,Set(IVR_RECORDING_FILE=${IVR_OUTBOUND_RECORDING})
exten => 1,n,Set(IVR_CALL_NAME=IVR-${IVR_SESSION_ID})
exten => 1,n,AGI(ivr_handler.py,schedule_call)
exten => 1,n,GotoIf($[${CALL_SCHEDULED} = 1]?success:fail)
exten => 1,n(success),Playback(${IVR_PROMPTS}/call-scheduled)
exten => 1,n,Playback(${IVR_PROMPTS}/goodbye)
exten => 1,n,Hangup()
exten => 1,n(fail),Playback(${IVR_PROMPTS}/error-scheduling)
exten => 1,n,Goto(ivr-recording-options,s,1)

; Press 2 - Re-enter date/time
exten => 2,1,Goto(ivr-schedule,s,1)

; Press 9 - Back to recording options
exten => 9,1,Goto(ivr-recording-options,s,1)

; Timeout or invalid
exten => t,1,Goto(ivr-confirm-schedule,s,1)
exten => i,1,Playback(${IVR_PROMPTS}/invalid-option)
exten => i,n,Goto(ivr-confirm-schedule,s,1)

; ============================================
; IVR ADD CONTACT TO GROUP
; ============================================
[ivr-add-contact]
exten => s,1,NoOp(Add Contact to Group)
; Get list of groups via AGI
exten => s,n,AGI(ivr_handler.py,get_groups)
exten => s,n,GotoIf($[${GROUP_COUNT} > 0]?has_groups:no_groups)

; No groups found
exten => s,n(no_groups),Playback(${IVR_PROMPTS}/no-groups-found)
exten => s,n,Goto(ivr-main-menu,s,1)

; Play group list
exten => s,n(has_groups),Playback(${IVR_PROMPTS}/select-group)
exten => s,n,Goto(ivr-select-group-contact,s,1)

; ============================================
; IVR SELECT GROUP (for adding contact)
; ============================================
[ivr-select-group-contact]
exten => s,1,NoOp(Select Group for Contact)
exten => s,n,Set(i=1)
; Loop through groups and announce them
exten => s,n(loop),GotoIf($[${i} > ${GROUP_COUNT}]?wait_selection)
exten => s,n,SayNumber(${i})
exten => s,n,Playback(${IVR_PROMPTS}/for)
; Play TTS audio for group name (generated by AGI), fallback to SayAlpha if not available
exten => s,n,GotoIf($["${GROUP_${i}_AUDIO}" != ""]?playtts:sayalpha)
exten => s,n(playtts),Playback(${GROUP_${i}_AUDIO})
exten => s,n,Goto(s,nextgroup)
exten => s,n(sayalpha),SayAlpha(${GROUP_${i}_NAME})
exten => s,n(nextgroup),Set(i=$[${i} + 1])
exten => s,n,Goto(s,loop)
exten => s,n(wait_selection),Playback(beep)
exten => s,n,Read(SELECTED_GROUP,,1,,,10)
exten => s,n,GotoIf($[${SELECTED_GROUP} >= 1 && ${SELECTED_GROUP} <= ${GROUP_COUNT}]?valid:invalid)
exten => s,n(invalid),Playback(${IVR_PROMPTS}/invalid-option)
exten => s,n,Goto(ivr-select-group-contact,s,1)
exten => s,n(valid),Set(CONTACT_GROUP_NAME=${GROUP_${SELECTED_GROUP}_NAME})
exten => s,n,Set(CONTACT_GROUP_ID=${GROUP_${SELECTED_GROUP}_ID})
; Confirm group selection
exten => s,n,Playback(${IVR_PROMPTS}/you-selected)
exten => s,n,GotoIf($["${GROUP_${SELECTED_GROUP}_AUDIO}" != ""]?playtts2:sayalpha2)
exten => s,n(playtts2),Playback(${GROUP_${SELECTED_GROUP}_AUDIO})
exten => s,n,Goto(s,ask_number)
exten => s,n(sayalpha2),SayAlpha(${CONTACT_GROUP_NAME})
exten => s,n(ask_number),Goto(ivr-enter-phone,s,1)

; Handle digit presses (1-9)
exten => _X,1,Set(SELECTED_GROUP=${EXTEN})
exten => _X,n,GotoIf($[${SELECTED_GROUP} >= 1 && ${SELECTED_GROUP} <= ${GROUP_COUNT}]?valid:invalid)
exten => _X,n(invalid),Playback(${IVR_PROMPTS}/invalid-option)
exten => _X,n,Goto(ivr-select-group-contact,s,1)
exten => _X,n(valid),Set(CONTACT_GROUP_NAME=${GROUP_${SELECTED_GROUP}_NAME})
exten => _X,n,Set(CONTACT_GROUP_ID=${GROUP_${SELECTED_GROUP}_ID})
exten => _X,n,Playback(${IVR_PROMPTS}/you-selected)
exten => _X,n,GotoIf($["${GROUP_${SELECTED_GROUP}_AUDIO}" != ""]?playtts3:sayalpha3)
exten => _X,n(playtts3),Playback(${GROUP_${SELECTED_GROUP}_AUDIO})
exten => _X,n,Goto(ivr-enter-phone,s,1)
exten => _X,n(sayalpha3),SayAlpha(${CONTACT_GROUP_NAME})
exten => _X,n,Goto(ivr-enter-phone,s,1)

; Press 0 - Back to main menu
exten => 0,1,Goto(ivr-main-menu,s,1)

; Timeout or invalid
exten => t,1,Goto(ivr-select-group-contact,s,1)
exten => i,1,Playback(${IVR_PROMPTS}/invalid-option)
exten => i,n,Goto(ivr-select-group-contact,s,1)

; ============================================
; IVR ENTER PHONE NUMBER (for adding contact)
; ============================================
[ivr-enter-phone]
exten => s,1,NoOp(Enter Phone Number)
exten => s,n,Playback(${IVR_PROMPTS}/enter-phone-number)
exten => s,n,Read(CONTACT_PHONE,,10,,,30)
exten => s,n,GotoIf($[${LEN(${CONTACT_PHONE})} = 10]?valid:invalid)
exten => s,n(invalid),Playback(${IVR_PROMPTS}/invalid-number)
exten => s,n,Goto(ivr-enter-phone,s,1)
exten => s,n(valid),Goto(ivr-confirm-contact,s,1)

; Press 0 - Back to group selection
exten => 0,1,Goto(ivr-select-group-contact,s,1)

; Timeout
exten => t,1,Goto(ivr-enter-phone,s,1)

; ============================================
; IVR CONFIRM CONTACT
; ============================================
[ivr-confirm-contact]
exten => s,1,NoOp(Confirm Contact: ${CONTACT_PHONE} to group ${CONTACT_GROUP_NAME})
exten => s,n,Playback(${IVR_PROMPTS}/you-entered)
; Read back the phone number digit by digit
exten => s,n,SayDigits(${CONTACT_PHONE})
exten => s,n,Playback(${IVR_PROMPTS}/press-1-confirm)
exten => s,n,Read(CONFIRM,,1,,,10)
exten => s,n,GotoIf($["${CONFIRM}" = "1"]?save:reenter)
exten => s,n(reenter),Goto(ivr-enter-phone,s,1)
exten => s,n(save),AGI(ivr_handler.py,add_contact_to_group)
exten => s,n,GotoIf($[${CONTACT_ADDED} = 1]?success:fail)
exten => s,n(success),Playback(${IVR_PROMPTS}/contact-added)
exten => s,n,Goto(ivr-main-menu,s,1)
exten => s,n(fail),Playback(${IVR_PROMPTS}/error-adding-contact)
exten => s,n,Goto(ivr-main-menu,s,1)

; Press 1 - Confirm
exten => 1,1,AGI(ivr_handler.py,add_contact_to_group)
exten => 1,n,GotoIf($[${CONTACT_ADDED} = 1]?success:fail)
exten => 1,n(success),Playback(${IVR_PROMPTS}/contact-added)
exten => 1,n,Goto(ivr-main-menu,s,1)
exten => 1,n(fail),Playback(${IVR_PROMPTS}/error-adding-contact)
exten => 1,n,Goto(ivr-main-menu,s,1)

; Press 2 - Re-enter number
exten => 2,1,Goto(ivr-enter-phone,s,1)

; Press 0 - Cancel and go back
exten => 0,1,Goto(ivr-main-menu,s,1)

; Timeout or invalid
exten => t,1,Goto(ivr-confirm-contact,s,1)
exten => i,1,Playback(${IVR_PROMPTS}/invalid-option)
exten => i,n,Goto(ivr-confirm-contact,s,1)

; ============================================
; OUTBOUND PLAYBACK CONTEXT (for system calls)
; ============================================
[outbound-playback]
exten => s,1,Answer()
; Skip AMD for internal extension calls (SIP devices don't have answering machines)
exten => s,n,GotoIf($["${CALL_DIRECTION}" = "internal"]?skip_amd)
; Check if AMD is enabled (AMD_ENABLED=1)
exten => s,n,GotoIf($["${AMD_ENABLED}" = "1"]?do_amd:skip_amd)

; Run Answering Machine Detection if enabled
exten => s,n(do_amd),AMD()
; Store AMD result for CDR (AMDSTATUS: MACHINE, HUMAN, NOTSURE, HANGUP)
exten => s,n,Set(CALL_RESULT=${AMDSTATUS})
; Store outbound call info in CDR userfield: OUTBOUND|caller_id|destination|context|amd_result
exten => s,n,Set(CDR(userfield)=OUTBOUND|${CUSTOM_CALLERID}|${PHONE_NUMBER}|broadcast|${AMDSTATUS})
; If the callee hung up during detection, just exit
exten => s,n,GotoIf($["${AMDSTATUS}" = "HANGUP"]?done)
exten => s,n,Goto(play_message)

; Skip AMD - set CDR based on call direction
exten => s,n(skip_amd),GotoIf($["${CALL_DIRECTION}" = "internal"]?cdr_internal:cdr_outbound)
exten => s,n(cdr_internal),Set(CDR(userfield)=INTERNAL|${CUSTOM_CALLERID}|${PHONE_NUMBER}|internal|N/A)
exten => s,n,Goto(play_message)
exten => s,n(cdr_outbound),Set(CDR(userfield)=OUTBOUND|${CUSTOM_CALLERID}|${PHONE_NUMBER}|broadcast|DISABLED)

; Play message
exten => s,n(play_message),Wait(${PRE_MESSAGE_DELAY})
exten => s,n,Playback(custom/${AUDIO_FILE})
exten => s,n,Wait(1)
exten => s,n(done),Hangup()

; ============================================
; INBOUND CONTEXT - Broadcast Callback Playback
; Press * at any time to access admin menu (requires PIN)
; ============================================
[inbound]
; Handle incoming calls - play broadcast history if available
exten => _X.,1,Answer()
exten => _X.,n,Wait(1)
; Store the called number (DID) for callback lookup and CDR
exten => _X.,n,Set(CALLED_DID=${EXTEN})
; Store caller info and DID in CDR userfield for proper logging
exten => _X.,n,Set(CDR(userfield)=INBOUND|${CALLERID(num)}|${EXTEN}|callback)
; Run AGI to look up broadcast callbacks for this number
exten => _X.,n,AGI(callback_lookup.py)
; Check if any callbacks were found
exten => _X.,n,GotoIf($[${CALLBACK_COUNT} > 0]?play_callbacks:no_callbacks)

; No callbacks - play message, offer admin access, then hang up
exten => _X.,n(no_callbacks),NoOp(No broadcast callbacks found)
exten => _X.,n,Background(${IVR_PROMPTS}/no-recordings)
exten => _X.,n,Background(${IVR_PROMPTS}/press-star-admin)
exten => _X.,n,WaitExten(3)
exten => _X.,n,Hangup()

; Play broadcast callbacks - newest first (use Background to detect *)
; Go directly to playing messages without greeting
exten => _X.,n(play_callbacks),NoOp(Playing ${CALLBACK_COUNT} broadcast recordings)
exten => _X.,n,Set(CB_INDEX=1)
exten => _X.,n(play_loop),GotoIf($[${CB_INDEX} > ${CALLBACK_COUNT}]?done_playing)
; Get the audio file for this index
exten => _X.,n,Set(CURRENT_FILE=${CALLBACK_${CB_INDEX}})
exten => _X.,n,NoOp(Playing recording ${CB_INDEX}: ${CURRENT_FILE})
; Play the recording (use Background to allow * interrupt)
exten => _X.,n,Background(${CURRENT_FILE:0:-4})
exten => _X.,n,Wait(1)
; Play beep between recordings if there are more
exten => _X.,n,Set(CB_INDEX=$[${CB_INDEX} + 1])
exten => _X.,n,GotoIf($[${CB_INDEX} <= ${CALLBACK_COUNT}]?play_beep:play_loop)
exten => _X.,n(play_beep),Playback(beep)
exten => _X.,n,Goto(play_loop)

; Done playing all recordings - hang up
exten => _X.,n(done_playing),NoOp(Finished playing all broadcast recordings)
exten => _X.,n,Background(${IVR_PROMPTS}/end-of-messages)
exten => _X.,n,Background(${IVR_PROMPTS}/goodbye)
exten => _X.,n,WaitExten(2)
exten => _X.,n,Hangup()

; Press * for admin access
exten => *,1,NoOp(Admin access requested)
exten => *,n,Goto(admin-pin,s,1)

; Timeout or invalid - just hang up
exten => t,1,Hangup()
exten => i,1,Hangup()

; ============================================
; ADMIN PIN AUTHENTICATION
; ============================================
[admin-pin]
exten => s,1,NoOp(Admin PIN Authentication)
exten => s,n,Set(PIN_CALLER=${CALLERID(num)})
; Enforce a persistent cross-call lockout so the 4-digit PIN cannot be
; brute-forced by redialing (the per-call 3-try limit alone did not persist).
; AstDB key admin_lockout/<caller> stores an epoch expiry.
exten => s,n,Set(LOCK_UNTIL=${DB(admin_lockout/${PIN_CALLER})})
exten => s,n,GotoIf($[${ISNULL(${LOCK_UNTIL})} = 0 & ${EPOCH} < ${LOCK_UNTIL}]?locked_out)
; Fetch admin PIN from database via AGI (sets ADMIN_PIN, or a deny sentinel)
exten => s,n,AGI(verify_admin_pin.py)
exten => s,n,Set(PIN_ATTEMPTS=0)
exten => s,n(ask_pin),Playback(${IVR_PROMPTS}/enter-admin-pin)
exten => s,n,Read(ENTERED_PIN,,4,,,10)
exten => s,n,GotoIf($["${ENTERED_PIN}" = "${ADMIN_PIN}"]?pin_correct:pin_wrong)

; PIN correct - clear failure counters and go to admin menu
exten => s,n(pin_correct),NoOp(${DB_DELETE(admin_fails/${PIN_CALLER})})
exten => s,n,NoOp(${DB_DELETE(admin_lockout/${PIN_CALLER})})
exten => s,n,Playback(${IVR_PROMPTS}/access-granted)
exten => s,n,Set(IVR_SESSION_ID=${STRFTIME(${EPOCH},,%Y%m%d%H%M%S)})
exten => s,n,Set(IVR_RECORDING=${RECORDING_DIR}/ivr-${IVR_SESSION_ID}.wav)
exten => s,n,Goto(ivr-main-menu,s,1)

; PIN wrong - count this attempt both per-call and cumulatively across calls
exten => s,n(pin_wrong),Set(PIN_ATTEMPTS=$[${PIN_ATTEMPTS} + 1])
exten => s,n,Set(PREV_FAILS=${DB(admin_fails/${PIN_CALLER})})
exten => s,n,Set(PREV_FAILS=${IF($[${ISNULL(${PREV_FAILS})}]?0:${PREV_FAILS})})
exten => s,n,Set(TOTAL_FAILS=$[${PREV_FAILS} + 1])
exten => s,n,Set(DB(admin_fails/${PIN_CALLER})=${TOTAL_FAILS})
; After 10 cumulative failures, lock this caller out for 1 hour
exten => s,n,GotoIf($[${TOTAL_FAILS} >= 10]?lockout)
exten => s,n,GotoIf($[${PIN_ATTEMPTS} >= 3]?too_many_attempts)
exten => s,n,Playback(${IVR_PROMPTS}/incorrect-pin)
exten => s,n,Goto(s,ask_pin)

; Persistent lockout - store an expiry 1 hour out, then hang up
exten => s,n(lockout),Set(DB(admin_lockout/${PIN_CALLER})=$[${EPOCH} + 3600])
exten => s,n(locked_out),Playback(${IVR_PROMPTS}/too-many-attempts)
exten => s,n,Hangup()

; Too many failed attempts (this call)
exten => s,n(too_many_attempts),Playback(${IVR_PROMPTS}/too-many-attempts)
exten => s,n,Playback(${IVR_PROMPTS}/goodbye)
exten => s,n,Hangup()

; ============================================
; INTERNAL CONTEXT
; ============================================
[internal]
; Internal extension-to-extension calls
exten => _1XX,1,NoOp(=== Internal Call to ${EXTEN} ===)
 same => n,Dial(SIP/${EXTEN},30,tr)
 same => n,Hangup()

; Recording/IVR system extension (default 999, configurable via RECORDING_EXT_PLACEHOLDER)
exten => RECORDING_EXT_PLACEHOLDER,1,NoOp(=== Calling IVR System ===)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Goto(ivr-pin-auth,s,1)

; 10-digit US/Canada dialing - auto-prepend 1
exten => _NXXNXXXXXX,1,NoOp(=== Outbound Call to 1${EXTEN} ===)
 same => n,Set(CALLERID(num)=${OUTBOUND_CID})
 same => n,Dial(SIP/trunk_main/1${EXTEN},120,tT)
 same => n,Hangup()

; 11-digit US/Canada dialing (1-NPA-NXX-XXXX)
exten => _1NXXNXXXXXX,1,NoOp(=== Outbound Call to ${EXTEN} ===)
 same => n,Set(CALLERID(num)=${OUTBOUND_CID})
 same => n,Dial(SIP/trunk_main/${EXTEN},120,tT)
 same => n,Hangup()

; International calls (011 + country code + number)
exten => _011.,1,NoOp(=== International Call to ${EXTEN} ===)
 same => n,Set(CALLERID(num)=${OUTBOUND_CID})
 same => n,Dial(SIP/trunk_main/${EXTEN},120,tT)
 same => n,Hangup()

; Toll-free numbers (1-8XX-XXX-XXXX)
exten => _18XXNXXXXXX,1,NoOp(=== Toll-Free Call to ${EXTEN} ===)
 same => n,Set(CALLERID(num)=${OUTBOUND_CID})
 same => n,Dial(SIP/trunk_main/${EXTEN},120,tT)
 same => n,Hangup()

; Emergency calls (911)
exten => 911,1,NoOp(=== Emergency Call to 911 ===)
 same => n,Set(CALLERID(num)=${OUTBOUND_CID})
 same => n,Dial(SIP/trunk_main/911,120,tT)
 same => n,Hangup()
