[general]
static=yes
writeprotect=no

[default]
; Internal extension to extension calls
exten => _XXX,1,NoOp(Internal call to ${EXTEN})
    same => n,Dial(SIP/${EXTEN},30,rtT)
    same => n,Hangup()

exten => _XXXX,1,NoOp(Internal call to ${EXTEN})
    same => n,Dial(SIP/${EXTEN},30,rtT)
    same => n,Hangup()

; Outbound calls (10 digits)
exten => _NXXNXXXXXX,1,NoOp(Outbound call to ${EXTEN})
    same => n,Dial(SIP/trunk_main/${EXTEN},60)
    same => n,Hangup()

; Outbound calls (11 digits with 1)
exten => _1NXXNXXXXXX,1,NoOp(Outbound call to ${EXTEN})
    same => n,Dial(SIP/trunk_main/${EXTEN:1},60)
    same => n,Hangup()

; Emergency
exten => 911,1,Dial(SIP/trunk_main/911)
    same => n,Hangup()

[outbound-playback]
; Broadcast calls with TTS
exten => s,1,Answer()
    same => n,Wait(${PRE_MESSAGE_DELAY})
    same => n,Playback(${AUDIO_FILE})
    same => n,Wait(1)
    same => n,Hangup()

[from-external]
; Inbound calls from trunk
exten => _X.,1,NoOp(Inbound from ${CALLERID(num)})
    same => n,Answer()
    same => n,Wait(1)
    same => n,Dial(SIP/100,30)
    same => n,Hangup()

exten => s,1,Answer()
    same => n,Playback(hello-world)
    same => n,Hangup()
