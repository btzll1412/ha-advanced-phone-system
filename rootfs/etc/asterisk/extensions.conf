[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

[outbound-playback]
; Context for automated outbound calls with AMD
exten => s,1,NoOp(=== Outbound Call Started ===)
    same => n,NoOp(Phone: ${PHONE_NUMBER})
    same => n,NoOp(Audio: ${AUDIO_FILE})
    same => n,NoOp(Call ID: ${CALL_ID})
    same => n,NoOp(Custom Caller ID: ${CUSTOM_CALLERID})
    same => n,Set(CALLERID(all)=${CUSTOM_CALLERID})
    same => n,SIPAddHeader(From: <sip:${CUSTOM_CALLERID}@${SIPDOMAIN}>)
    same => n,System(curl -X POST "http://localhost:8088/api/call_status/ringing?call_id=${CALL_ID}" 2>/dev/null)
    same => n,Answer()
    same => n,Wait(0.5)
    same => n,System(curl -X POST "http://localhost:8088/api/call_status/answered?call_id=${CALL_ID}" 2>/dev/null)
    ; ============================================
    ; 🎯 AMD - ANSWERING MACHINE DETECTION
    ; ============================================
    same => n,AMD(2000,2000,1000,5000,120,50,5,256)
    same => n,NoOp(AMD Result: ${AMDSTATUS} - ${AMDCAUSE})
    same => n,Set(CDR(userfield)=AMD:${AMDSTATUS}:${AMDCAUSE})
    same => n,GotoIf($["${AMDSTATUS}" = "MACHINE"]?voicemail)
    same => n,GotoIf($["${AMDSTATUS}" = "HUMAN"]?human)
    same => n,Goto(unknown)
    ; Real person answered
    same => n(human),NoOp(=== HUMAN DETECTED ===)
    same => n,Set(IS_VOICEMAIL=0)
    same => n,System(curl -X POST "http://localhost:8088/api/call_status?call_id=${CALL_ID}&status=human_answered&is_voicemail=0" 2>/dev/null)
    same => n,Wait(${PRE_MESSAGE_DELAY})
    same => n,Playback(custom/${AUDIO_FILE})
    same => n,Wait(2)
    same => n,Goto(end)
    ; Voicemail detected
    same => n(voicemail),NoOp(=== VOICEMAIL DETECTED ===)
    same => n,Set(IS_VOICEMAIL=1)
    same => n,System(curl -X POST "http://localhost:8088/api/call_status?call_id=${CALL_ID}&status=voicemail&is_voicemail=1" 2>/dev/null)
    same => n,Wait(1)
    same => n,WaitForSilence(500,3)
    same => n,Playback(custom/${AUDIO_FILE})
    same => n,Wait(2)
    same => n,Goto(end)
    ; Couldn't determine
    same => n(unknown),NoOp(=== AMD UNCERTAIN ===)
    same => n,Set(IS_VOICEMAIL=2)
    same => n,System(curl -X POST "http://localhost:8088/api/call_status?call_id=${CALL_ID}&status=uncertain&is_voicemail=2" 2>/dev/null)
    same => n,Wait(${PRE_MESSAGE_DELAY})
    same => n,Playback(custom/${AUDIO_FILE})
    same => n,Wait(2)
    same => n,Goto(end)
    ; End call
    same => n(end),System(curl -X POST "http://localhost:8088/api/call_status?call_id=${CALL_ID}&status=completed&is_voicemail=${IS_VOICEMAIL}" 2>/dev/null)
    same => n,Hangup()

exten => h,1,NoOp(=== Call Ended ===)
    same => n,System(curl -X POST "http://localhost:8088/api/call_status?call_id=${CALL_ID}&status=hangup&is_voicemail=${IS_VOICEMAIL}" 2>/dev/null)

[inbound]
; Context for incoming calls
exten => _X.,1,NoOp(=== Incoming Call ===)
    same => n,NoOp(From: ${CALLERID(num)})
    same => n,Set(CALL_ID=${UNIQUEID})
    same => n,System(curl -X POST "http://localhost:8088/api/call_status?call_id=${CALL_ID}&status=ringing" 2>/dev/null)
    same => n,Answer()
    same => n,Wait(1)
    same => n,Playback(welcome)
    same => n,System(curl -X POST "http://localhost:8088/api/call_status?call_id=${CALL_ID}&status=answered" 2>/dev/null)
    same => n,Hangup()

[internal]
; Internal extension-to-extension calls
exten => _1XX,1,NoOp(=== Internal Call to ${EXTEN} ===)
    same => n,Dial(SIP/${EXTEN},30,tr)
    same => n,Hangup()

; Recording system extension
exten => 999,1,NoOp(=== Calling Recording System ===)
    same => n,Goto(record-messages,s,1)

; 10-digit US/Canada dialing - auto-prepend 1
exten => _NXXNXXXXXX,1,NoOp(=== Outbound Call to 1${EXTEN} ===)
    same => n,Set(CALLERID(num)=${OUTBOUND_CID})
    same => n,Dial(SIP/trunk_main/1${EXTEN},120,tT)
    same => n,Hangup()

; 11-digit US/Canada dialing (1-NPA-NXX-XXXX)
exten => _1NXXNXXXXXX,1,NoOp(=== Outbound Call to ${EXTEN} ===)
    same => n,Set(CALLERID(num)=${OUTBOUND_CID})
    same => n,Dial(SIP/trunk_main/${EXTEN},120,tT)
    same => n,Hangup()

; International calls (011 + country code + number)
exten => _011.,1,NoOp(=== International Call to ${EXTEN} ===)
    same => n,Set(CALLERID(num)=${OUTBOUND_CID})
    same => n,Dial(SIP/trunk_main/${EXTEN},120,tT)
    same => n,Hangup()

; Emergency calls (911)
exten => 911,1,NoOp(=== Emergency Call to 911 ===)
    same => n,Set(CALLERID(num)=${OUTBOUND_CID})
    same => n,Dial(SIP/trunk_main/911,120,tT)
    same => n,Hangup()

[default]
; Default context (fallback)
exten => _X.,1,NoOp(=== Default Context ===)
    same => n,Hangup()
