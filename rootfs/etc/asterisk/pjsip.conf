[global]
max_forwards=70
user_agent=HA-Advanced-Phone
default_realm=homeassistant.local

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; =====================================
; SIP TRUNK - Flowroute
; =====================================
[trunk_main]
type=endpoint
context=from-external
disallow=all
allow=ulaw
allow=alaw
aors=trunk_main
outbound_auth=trunk_main
from_user=${CALLER_NUMBER}
from_domain=us-west-or.sip.flowroute.com

[trunk_main]
type=aor
contact=sip:us-west-or.sip.flowroute.com

[trunk_main]
type=auth
auth_type=userpass
username=${FLOWROUTE_ACCESS_KEY}
password=${FLOWROUTE_SECRET_KEY}

[trunk_main]
type=identify
endpoint=trunk_main
match=us-west-or.sip.flowroute.com

; =====================================
; INTERNAL EXTENSIONS (Template)
; =====================================
[extension_template](!)
type=endpoint
context=default
disallow=all
allow=ulaw
allow=alaw
direct_media=no

; Extension 100
[100](extension_template)
auth=100
aors=100
callerid="Reception" <100>

[100]
type=auth
auth_type=userpass
password=${EXT_100_PASSWORD}
username=100

[100]
type=aor
max_contacts=3
remove_existing=yes

; Extension 101
[101](extension_template)
auth=101
aors=101
callerid="Extension 101" <101>

[101]
type=auth
auth_type=userpass
password=${EXT_101_PASSWORD}
username=101

[101]
type=aor
max_contacts=3

; Extension 102
[102](extension_template)
auth=102
aors=102
callerid="Extension 102" <102>

[102]
type=auth
auth_type=userpass
password=${EXT_102_PASSWORD}
username=102

[102]
type=aor
max_contacts=3
