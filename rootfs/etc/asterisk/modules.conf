[modules]
autoload=yes

; Load PJSIP (new SIP stack)
load = res_pjsip.so
load = res_pjsip_session.so
load = res_pjsip_outbound_registration.so
load = res_pjsip_endpoint_identifier_ip.so
load = res_pjsip_authenticator_digest.so
load = chan_pjsip.so

; Keep old chan_sip for compatibility
load = chan_sip.so

; Core modules
load = pbx_config.so
load = app_dial.so
load = app_playback.so
load = app_voicemail.so
load = res_musiconhold.so

; Audio format modules - essential for playback
load = format_wav.so
load = format_gsm.so
load = format_sln.so
load = format_pcm.so

; Codec modules for transcoding
load = codec_ulaw.so
load = codec_alaw.so
load = codec_gsm.so
