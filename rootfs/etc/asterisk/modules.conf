[modules]
autoload=yes

; This add-on is configured entirely for chan_sip (sip.conf is generated at
; startup); there is no pjsip.conf. Loading the PJSIP channel driver alongside
; chan_sip means two SIP channel drivers compete, so keep PJSIP's channel
; driver out. chan_sip is the single, configured SIP stack.
noload = chan_pjsip.so

; The configured SIP stack
load = chan_sip.so

; Call Detail Records - the API imports call completion from the CSV backend.
; Load explicitly so a missing/failed autoload shows up in the log instead of
; silently leaving calls stuck as "active".
load = cdr_csv.so

; Core modules
load = pbx_config.so
load = app_dial.so
load = app_playback.so
load = app_voicemail.so
load = res_musiconhold.so

; Audio format modules - essential for playback
load = format_wav.so
load = format_gsm.so
load = format_sln.so
load = format_pcm.so

; Codec modules for transcoding
load = codec_ulaw.so
load = codec_alaw.so
load = codec_gsm.so

; Answering Machine Detection
load = app_amd.so
