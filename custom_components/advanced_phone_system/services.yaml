make_call:
  name: Make Call
  description: Make a phone call with TTS or recording
  fields:
    phone_number:
      name: Phone Number
      description: Phone number to call (E.164 format, e.g., +1234567890)
      required: true
      example: "+1234567890"
      selector:
        text:
    tts_text:
      name: TTS Text
      description: Text to speak via text-to-speech
      required: false
      example: "This is a test call from Home Assistant"
      selector:
        text:
          multiline: true
    recording_file:
      name: Recording File
      description: Name of pre-recorded audio file (without path)
      required: false
      example: "alert.wav"
      selector:
        text:
    caller_id:
      name: Caller ID
      description: Caller ID to display
      required: false
      example: "Home Assistant"
      selector:
        text:
    max_retries:
      name: Max Retries
      description: Maximum number of retry attempts
      required: false
      default: 3
      selector:
        number:
          min: 0
          max: 10

create_broadcast:
  name: Create Broadcast
  description: Send a message to multiple phone numbers
  fields:
    name:
      name: Broadcast Name
      description: Name for this broadcast
      required: true
      example: "Emergency Alert"
      selector:
        text:
    phone_numbers:
      name: Phone Numbers
      description: List of phone numbers to call
      required: false
      example: ["+1234567890", "+1234567891"]
      selector:
        object:
    group_name:
      name: Group Name
      description: Name of saved contact group
      required: false
      example: "Family"
      selector:
        text:
    tts_text:
      name: TTS Text
      description: Text to speak via text-to-speech
      required: false
      example: "This is an emergency broadcast"
      selector:
        text:
          multiline: true
    recording_file:
      name: Recording File
      description: Name of pre-recorded audio file
      required: false
      example: "emergency.wav"
      selector:
        text:
    caller_id:
      name: Caller ID
      description: Caller ID to display
      required: false
      example: "Emergency Services"
      selector:
        text:
    concurrent_calls:
      name: Concurrent Calls
      description: Maximum simultaneous calls
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 20

call_with_sensor:
  name: Call with Sensor Data
  description: Make a call with dynamic sensor values in message
  fields:
    phone_number:
      name: Phone Number
      description: Phone number to call
      required: true
      example: "+1234567890"
      selector:
        text:
    message:
      name: Message Template
      description: Message with sensor templates
      required: true
      example: "Temperature is {{ states('sensor.temperature') }} degrees"
      selector:
        text:
          multiline: true
    caller_id:
      name: Caller ID
      description: Caller ID to display
      required: false
      example: "Home Alert"
      selector:
        text:
    max_retries:
      name: Max Retries
      description: Maximum number of retry attempts
      required: false
      default: 3
      selector:
        number:
          min: 0
          max: 10

broadcast_with_sensor:
  name: Broadcast with Sensor Data
  description: Send a broadcast with dynamic sensor values in message to multiple phone numbers
  fields:
    name:
      name: Broadcast Name
      description: Name for this broadcast
      required: true
      example: "Weather Alert"
      selector:
        text:
    phone_numbers:
      name: Phone Numbers
      description: List of phone numbers to call
      required: false
      example: ["+1234567890", "+1234567891"]
      selector:
        object:
    group_name:
      name: Group Name
      description: Name of saved contact group
      required: false
      example: "Family"
      selector:
        text:
    message:
      name: Message Template
      description: Message with sensor templates (supports Home Assistant entity states)
      required: true
      example: "Alert! Temperature is {{ states('sensor.temperature') }} degrees. Humidity is {{ states('sensor.humidity') }} percent."
      selector:
        text:
          multiline: true
    caller_id:
      name: Caller ID
      description: Caller ID to display
      required: false
      example: "Weather Service"
      selector:
        text:
    concurrent_calls:
      name: Concurrent Calls
      description: Maximum simultaneous calls
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 20

call_extension:
  name: Call Extension
  description: Call an internal SIP extension (e.g., an Algo speaker) and play a recording or TTS message. No AMD or callback is triggered — the audio plays as soon as the extension answers.
  fields:
    extension:
      name: Extension Number
      description: Internal SIP extension number to call (2-4 digits, e.g., "100", "200")
      required: true
      example: "200"
      selector:
        text:
    recording_file:
      name: Recording File
      description: Name of a pre-uploaded audio file to play (filename only, without path, e.g., "alert.wav")
      required: false
      example: "alert.wav"
      selector:
        text:
    tts_text:
      name: TTS Message
      description: Text to convert to speech and play on the extension
      required: false
      example: "Motion detected at the front door"
      selector:
        text:
          multiline: true
    caller_id:
      name: Caller ID
      description: Label shown as the caller on the extension display
      required: false
      example: "Home Assistant"
      selector:
        text:

create_group:
  name: Create Contact Group
  description: Create a new contact group
  fields:
    name:
      name: Group Name
      description: Name for the contact group
      required: true
      example: "Family"
      selector:
        text:
    phone_numbers:
      name: Phone Numbers
      description: List of phone numbers in group
      required: true
      example: ["+1234567890", "+1234567891"]
      selector:
        object:
    caller_id:
      name: Default Caller ID
      description: Default caller ID for this group
      required: false
      example: "Family Alert"
      selector:
        text:
